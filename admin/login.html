<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Staff Login | AJ Construction Inc</title>
  <script type="module" src="/src/js/admin/login-page.js"></script>
</head>
<body data-portal="login">
  <main class="portal-center">
    <div class="portal-card">
      <span class="portal-logo"><img src="/assets/logo/aj-logo.png" alt="AJ Construction Inc" width="1808" height="1088" /></span>
      <h1>Staff Login</h1>
      <p class="portal-card__lede">This is an invite-only portal. Contact management for access.</p>

      <div id="form-status" hidden></div>

      <form id="login-form" novalidate>
        <div class="portal-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="portal-field">
          <label for="password">Password</label>
          <div class="portal-field__input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" class="portal-field__toggle" data-toggle-password aria-label="Show password" aria-pressed="false"></button>
          </div>
        </div>
        <button class="portal-btn" type="submit" data-submit>Log In</button>
      </form>

      <p class="portal-link-row"><a class="portal-link" href="/admin/forgot-password.html">Forgot your password?</a></p>
    </div>

    <p class="portal-footer">AJ Construction Inc &middot; CSLB #1129358 &middot; Internal system</p>
  </main>
</body>
</html>
