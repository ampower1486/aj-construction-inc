<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reset Password | AJ Construction Inc</title>
  <script type="module" src="/src/js/admin/forgot-password-page.js"></script>
</head>
<body data-portal="forgot-password">
  <main class="portal-center">
    <div class="portal-card">
      <span class="portal-logo"><img src="/assets/logo/aj-logo.png" alt="AJ Construction Inc" width="1808" height="1088" /></span>
      <h1>Reset Password</h1>
      <p class="portal-card__lede">Enter your account email and we will send you a reset link.</p>

      <div id="form-status" hidden></div>

      <form id="reset-form" novalidate>
        <div class="portal-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <button class="portal-btn" type="submit" data-submit>Send Reset Link</button>
      </form>

      <p class="portal-link-row"><a class="portal-link" href="/admin/login.html">Back to login</a></p>
    </div>

    <p class="portal-footer">AJ Construction Inc &middot; CSLB #1129358 &middot; Internal system</p>
  </main>
</body>
</html>
