<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Set Your Password | AJ Construction Inc</title>
  <script type="module" src="/src/js/admin/accept-invite-page.js"></script>
</head>
<body data-portal="accept-invite">
  <main class="portal-center">
    <div class="portal-card">
      <span class="portal-logo"><img src="/assets/logo/aj-logo.png" alt="AJ Construction Inc" width="1808" height="1088" /></span>
      <h1>Set Your Password</h1>
      <p class="portal-card__lede" id="lede">Checking your link…</p>

      <div id="form-status" hidden></div>

      <form id="invite-form" hidden novalidate>
        <div class="portal-field">
          <label for="password">New password</label>
          <div class="portal-field__input-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
            <button type="button" class="portal-field__toggle" data-toggle-password aria-label="Show password" aria-pressed="false"></button>
          </div>
        </div>
        <div class="portal-field">
          <label for="password2">Confirm password</label>
          <div class="portal-field__input-wrap">
            <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="8" required />
            <button type="button" class="portal-field__toggle" data-toggle-password aria-label="Show password" aria-pressed="false"></button>
          </div>
        </div>
        <button class="portal-btn" type="submit" data-submit>Set Password &amp; Continue</button>
      </form>
    </div>

    <p class="portal-footer">AJ Construction Inc &middot; CSLB #1129358 &middot; Internal system</p>
  </main>
</body>
</html>
